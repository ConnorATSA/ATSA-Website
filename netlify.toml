# ATSA website — Netlify config.
# Netlify runs the build (precompiles JSX, production React) and publishes dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Static case-studies page (QR code on conference slides points here).
# Must come before the SPA catch-all so /case-studies isn't swallowed by it.
[[redirects]]
  from = "/case-studies"
  to = "/case-studies/index.html"
  status = 200
  force = true   # serve directly; otherwise Netlify 301s to /case-studies/

# Hash-based SPA routing: every path resolves to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the content-stable assets.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Case studies name real children: keep the page and PDFs out of search engines.
[[headers]]
  for = "/case-studies"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/case-studies/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
